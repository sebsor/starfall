<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARFALL</title>
<meta name="description" content="STARFALL - a neon retro space shooter. Something was here before us.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4l7 21h21l-17 13 6 21-17-13-17 13 6-21L4 25h21z' fill='%23ff2bd6' stroke='%2300f0ff' stroke-width='3'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05050a;}
  body{overscroll-behavior:none;}
</style>
</head>
<body>
<div id="nvg-root">
  <div class="nvg-housing">
    <div class="nvg-plate">
      <span class="nvg-screw"></span>
      <span class="nvg-led nvg-led-pwr" title="Power"></span>
      <span class="nvg-plate-title">STARFALL DEEP-RANGE TELEMETRY</span>
      <span class="nvg-plate-sub">FEED 02 &middot; LONG-RANGE TRACKING CAMERA</span>
      <span class="nvg-led nvg-led-rec" id="nvg-rec" title="Recording"></span>
      <span class="nvg-led nvg-led-acc" title="Signal"></span>
      <span class="nvg-screw" id="nvg-screw-r"></span>
    </div>
    <div class="nvg-bezel">
      <div class="nvg-screen" id="nvg-frame">
        <canvas id="nvg-canvas" width="800" height="500" tabindex="0"
                aria-label="Starfall shooter. Arrow keys or WASD to move, Space to fire."></canvas>
        <div class="nvg-scan"></div>
        <div class="nvg-glass"></div>
        <div class="nvg-dev" id="nvg-dev" role="dialog" aria-label="Maintenance terminal"></div>
      </div>
    </div>
    <div class="nvg-panel">
      <div class="nvg-keys">
        <span class="nvg-key"><kbd>&larr;&uarr;&darr;&rarr;</kbd><kbd>WASD</kbd>MOVE</span>
        <span class="nvg-key"><kbd>SPACE</kbd>FIRE</span>
        <span class="nvg-key"><kbd>MOUSE</kbd><kbd>TOUCH</kbd>HOLD &amp; DRAG</span>
        <span class="nvg-key"><kbd>P</kbd>PAUSE</span>
        <span class="nvg-key"><kbd>M</kbd><kbd>N</kbd>AUDIO</span>
        <span class="nvg-key"><kbd>F</kbd>FULLSCREEN</span>
      </div>
      <div class="nvg-switches">
        <button type="button" class="nvg-switch" id="nvg-sound" aria-pressed="false"><i></i>SOUND</button>
        <button type="button" class="nvg-switch" id="nvg-music" aria-pressed="true"><i></i>MUSIC</button>
        <button type="button" class="nvg-switch" id="nvg-full" aria-pressed="false"><i></i>FULLSCREEN</button>
      </div>
    </div>
  </div>
</div>

<style>
  #nvg-root{--accent:#ff2bd6;--feed:0;position:fixed;inset:0;box-sizing:border-box;font-family:"Courier New",Consolas,monospace;}
  #nvg-root .nvg-housing{height:100%;display:flex;flex-direction:column;border-radius:0 !important;}
  #nvg-root .nvg-bezel{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  #nvg-root .nvg-screen{flex:none;}
  #nvg-root canvas{width:100% !important;height:100% !important;aspect-ratio:auto !important;}
  /* small screens: drop the key legend and sub-label, keep the SOUND / MUSIC / FULLSCREEN switches */
  @media (max-width:760px),(max-height:520px){
    #nvg-root .nvg-keys,#nvg-root .nvg-plate-sub{display:none !important;}
    #nvg-root .nvg-panel{margin-top:6px !important;justify-content:center !important;}
    #nvg-root .nvg-housing{padding:6px 10px 8px !important;}
    #nvg-root .nvg-plate{padding-bottom:6px !important;}
    #nvg-root .nvg-bezel{padding:6px !important;}
    #nvg-root .nvg-switch{padding:4px 10px !important;}
  }
  #nvg-root *{box-sizing:border-box;}
  /* the monitor's metal housing */
  #nvg-root .nvg-housing{position:relative;padding:12px 16px 14px;border-radius:20px;
    background:linear-gradient(180deg,#2b2f37 0%,#1c1f25 55%,#121418 100%);
    box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.6);}
  #nvg-root .nvg-housing:before{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;opacity:.35;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);}
  /* label plate */
  #nvg-root .nvg-plate{position:relative;display:flex;align-items:center;gap:10px;padding:2px 4px 10px;color:#8b93a5;
    font-size:11px;letter-spacing:2px;text-shadow:0 1px 0 rgba(0,0,0,.8),0 -1px 0 rgba(255,255,255,.06);}
  #nvg-root .nvg-plate-title{font-weight:700;color:#aab3c5;}
  #nvg-root .nvg-plate-sub{flex:1;opacity:.75;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #nvg-root .nvg-screw{width:9px;height:9px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 35% 35%,#6b7180,#2a2d34 70%);box-shadow:inset 0 0 1px #000;position:relative;}
  #nvg-root .nvg-screw:after{content:"";position:absolute;left:1px;right:1px;top:4px;height:1px;background:#1a1c21;transform:rotate(35deg);}
  #nvg-root .nvg-led{width:8px;height:8px;border-radius:50%;flex:none;background:#333;box-shadow:inset 0 0 2px #000;}
  #nvg-root .nvg-led-pwr{background:#3dff8a;box-shadow:0 0 6px #3dff8a,0 0 12px rgba(61,255,138,.5);}
  #nvg-root .nvg-led-acc{background:var(--accent);box-shadow:0 0 6px var(--accent);transition:background .6s,box-shadow .6s;}
  #nvg-root .nvg-led-rec.on{background:#ff3344;box-shadow:0 0 6px #ff3344,0 0 12px rgba(255,51,68,.5);}
  /* recessed bezel + CRT screen */
  #nvg-root .nvg-bezel{padding:12px;border-radius:24px;background:linear-gradient(180deg,#0a0b0e,#15171b);
    box-shadow:inset 0 3px 8px rgba(0,0,0,.9),inset 0 -1px 0 rgba(255,255,255,.07),0 1px 0 rgba(255,255,255,.06);}
  #nvg-root .nvg-screen{position:relative;border-radius:18px / 24px;overflow:hidden;background:#020205;
    box-shadow:0 0 0 1px rgba(0,0,0,.8),0 0 22px color-mix(in srgb,var(--accent) 35%,transparent);transition:box-shadow .6s;}
  #nvg-root canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;max-width:none;outline:none;cursor:crosshair;
    touch-action:none;user-select:none;-webkit-user-select:none;}
  /* scanlines get stronger once we're "watching the feed" */
  #nvg-root .nvg-scan{position:absolute;inset:0;pointer-events:none;opacity:calc(.2 + var(--feed) * .8);
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.28) 2px 3px);}
  /* curved glass: vignette + soft reflection */
  #nvg-root .nvg-glass{position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%),
               linear-gradient(125deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.02) 22%,rgba(255,255,255,0) 35%);
    box-shadow:inset 0 0 70px rgba(0,0,0,.75),inset 0 0 4px rgba(255,255,255,.08);}
  /* control panel */
  #nvg-root .nvg-panel{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:0 4px;}
  #nvg-root .nvg-keys{display:flex;flex-wrap:wrap;gap:6px 14px;}
  #nvg-root .nvg-key{display:inline-flex;align-items:center;gap:5px;color:#8b93a5;font-size:10px;letter-spacing:1.5px;
    text-shadow:0 1px 0 rgba(0,0,0,.8);}
  #nvg-root kbd{font:700 10px "Courier New",Consolas,monospace;color:#d7dce6;padding:2px 6px;border-radius:4px;
    background:linear-gradient(180deg,#3a3f4a,#23262d);box-shadow:0 2px 0 #0d0e11,inset 0 1px 0 rgba(255,255,255,.15);}
  #nvg-root .nvg-switches{display:flex;gap:8px;}
  #nvg-root .nvg-switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:#c3cad8;
    font:700 11px "Courier New",Consolas,monospace;letter-spacing:1.5px;padding:6px 12px;border:0;border-radius:6px;
    background:linear-gradient(180deg,#363b46,#1f2228);box-shadow:0 3px 0 #0b0c0f,inset 0 1px 0 rgba(255,255,255,.14);}
  #nvg-root .nvg-switch:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0c0f,inset 0 1px 0 rgba(255,255,255,.1);}
  #nvg-root .nvg-switch i{width:8px;height:8px;border-radius:50%;background:#3a1418;box-shadow:inset 0 0 2px #000;}
  #nvg-root .nvg-switch.on i{background:#3dff8a;box-shadow:0 0 6px #3dff8a;}
  #nvg-root .nvg-switch.dim{opacity:.55;}
  /* ---------- maintenance terminal (hidden mod console) ---------- */
  #nvg-root .nvg-screw.spin{animation:nvgspin .5s ease-out;}
  @keyframes nvgspin{to{transform:rotate(360deg);}}
  #nvg-root .nvg-dev{position:absolute;inset:0;display:none;flex-direction:column;z-index:5;overflow:hidden;border-radius:inherit;
    background:rgba(0,10,5,.94);color:#7dffb0;font:11px "Courier New",Consolas,monospace;letter-spacing:.5px;
    text-shadow:0 0 6px rgba(61,255,138,.55);}
  #nvg-root .nvg-dev.open{display:flex;animation:nvgdevin .25s ease-out;}
  @keyframes nvgdevin{from{opacity:0;transform:scaleY(.02);}to{opacity:1;transform:scaleY(1);}}
  #nvg-root .nvg-dev:after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.25) 2px 3px);}
  #nvg-root .nvg-dev-head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px dashed rgba(125,255,176,.35);font-weight:700;letter-spacing:2px;}
  #nvg-root .nvg-dev-warn{flex:1;color:#ff5a6a;text-shadow:0 0 6px rgba(255,60,80,.6);font-size:10px;animation:nvgblink 1.2s steps(2) infinite;}
  @keyframes nvgblink{50%{opacity:.25;}}
  #nvg-root .nvg-dev-grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:10px 14px;}
  #nvg-root .nvg-dev section{border:1px solid rgba(125,255,176,.25);border-radius:6px;padding:8px 10px;background:rgba(61,255,138,.03);}
  #nvg-root .nvg-dev h4{margin:0 0 6px;font-size:11px;color:#c9ffe0;letter-spacing:2px;}
  #nvg-root .nvg-dev .row{display:flex;align-items:center;gap:6px;margin:4px 0;}
  #nvg-root .nvg-dev .row.wrap{flex-wrap:wrap;}
  #nvg-root .nvg-dev .row.col{flex-direction:column;align-items:stretch;}
  #nvg-root .nvg-dev .row.dim{opacity:.6;font-size:10px;}
  #nvg-root .nvg-dev b{color:#ffe14d;text-shadow:0 0 6px rgba(255,225,77,.6);}
  #nvg-root .nvg-dev button{font:700 10px "Courier New",Consolas,monospace;letter-spacing:1px;color:#7dffb0;cursor:pointer;
    background:rgba(61,255,138,.08);border:1px solid rgba(125,255,176,.45);border-radius:4px;padding:4px 7px;text-shadow:inherit;text-align:left;}
  #nvg-root .nvg-dev button:hover{background:rgba(61,255,138,.22);color:#fff;}
  #nvg-root .nvg-dev button.on{background:rgba(61,255,138,.35);color:#fff;}
  #nvg-root .nvg-dev button em{float:right;font-style:normal;opacity:.7;margin-left:8px;}
  #nvg-root .nvg-dev .nvg-dev-x{border-color:rgba(255,90,106,.6);color:#ff8a96;}
  #nvg-root .nvg-dev input[type=range]{flex:1;accent-color:#3dff8a;}
  #nvg-root .nvg-dev output{min-width:42px;text-align:right;color:#ffe14d;}
  #nvg-root .nvg-dev select{flex:1;font:700 10px "Courier New",Consolas,monospace;color:#7dffb0;background:#021208;border:1px solid rgba(125,255,176,.45);border-radius:4px;padding:3px;}
  #nvg-root .nvg-tog{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;}
  #nvg-root .nvg-tog input{display:none;}
  #nvg-root .nvg-tog span{width:26px;height:13px;border-radius:7px;border:1px solid rgba(125,255,176,.5);position:relative;flex:none;}
  #nvg-root .nvg-tog span:after{content:"";position:absolute;top:2px;left:2px;width:7px;height:7px;border-radius:50%;background:#2a5a3a;transition:left .15s,background .15s;}
  #nvg-root .nvg-tog input:checked + span:after{left:15px;background:#3dff8a;box-shadow:0 0 6px #3dff8a;}
  #nvg-root .nvg-dev-foot{padding:6px 14px;border-top:1px dashed rgba(125,255,176,.35);opacity:.8;}
  #nvg-root .nvg-dev .cur{animation:nvgblink .8s steps(2) infinite;}
  #nvg-root.nvg-nocrt .nvg-scan,#nvg-root.nvg-nocrt .nvg-glass{display:none;}
</style>

<script>
(function () {
  var root = document.getElementById('nvg-root');

  var cv = document.getElementById('nvg-canvas');
  var ctx = cv.getContext('2d');
  var frameEl = document.getElementById('nvg-frame');
  var soundBtn = document.getElementById('nvg-sound');
  var musicBtn = document.getElementById('nvg-music');

  // =====================================================================
  //  SETTINGS
  // =====================================================================
  var INFO_EVERY_TIME = false;   // true = show the power-up card on every pickup, false = first time per type per game
  var MAX_LIVES = 6;

  // ---------- YOUR MUSIC ----------
  // The files live in a "music" folder next to the page. If a file is missing or can't load,
  // that track falls back to the built-in synth music, so the game always has a soundtrack.
  var MUSIC_BASE = 'music/';
  var MUSIC_FILES = {
    title:   'title-first-contact.mp3',               // start screen, prologue, title, story chapters, rewards
    neon:    'level1-nebula-arpeggio.mp3',
    boss1:   'level1-boss-galactic-arpeggio.mp3',
    crystal: 'level2-void-navigation.mp3',
    boss2:   'level2-boss-orbital-boss-rush.mp3',
    ancient: 'level3-the-frame-drums-pulse.mp3',
    boss3:   'level3-boss-the-chronos-leviathan.mp3',
    credits: 'end-credits-beyond-the-event-horizon.mp3' // the "To be continued" ending flows straight into the credits
  };
  var MUSIC_VOLUME = 0.8;

  // =====================================================================
  //  CONSTANTS & HELPERS
  // =====================================================================
  var W = 800, H = 500;
  var C = { cyan:'#00f0ff', mag:'#ff2bd6', pur:'#9d4dff', yel:'#ffe14d', org:'#ff8a1a', white:'#eafcff',
            green:'#5dff8a', red:'#ff3b5c', gold:'#ffb030', ice:'#7ff6ff', lilac:'#c58bff', teal:'#5effd2' };
  var FONT = '"Courier New", Consolas, monospace';

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function hitC(ax, ay, ar, bx, by, br) { var dx = ax - bx, dy = ay - by, r = ar + br; return dx * dx + dy * dy < r * r; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

  var dpr = 1;
  // The screen keeps the game's 8:5 shape and grows as large as the window allows.
  // The canvas is rendered at the real display size so it stays sharp; dpr = game units -> device pixels.
  function resize() {
    var bez = cv.parentNode.parentNode, cs = getComputedStyle(bez);
    var aw = bez.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var ah = bez.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var w = Math.max(160, Math.min(aw, ah * W / H)), h = w * H / W;
    cv.parentNode.style.width = w + 'px'; cv.parentNode.style.height = h + 'px';
    dpr = Math.min(w * (window.devicePixelRatio || 1) / W, 3);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  resize(); window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });

  var best = 0;
  try { best = parseInt(localStorage.getItem('nvg-best'), 10) || 0; } catch (e) {}
  function saveBest() { if (score > best) { best = score; try { localStorage.setItem('nvg-best', String(best)); } catch (e) {} return true; } return false; }

  // Pre-rendered glow sprite per colour (much cheaper than a gradient per bullet per frame)
  var spriteCache = {};
  function glow(col) {
    if (spriteCache[col]) return spriteCache[col];
    var s = document.createElement('canvas'); s.width = s.height = 64;
    var g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.22, col); gr.addColorStop(0.5, col + '55'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return (spriteCache[col] = s);
  }
  function drawGlow(col, x, y, w, h) { ctx.drawImage(glow(col), x - w / 2, y - h / 2, w, h); }
  var shadeSprite = (function () {
    var c = document.createElement('canvas'); c.width = c.height = 64;
    var g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(0,0,8,0.9)'); gr.addColorStop(0.55, 'rgba(0,0,8,0.55)'); gr.addColorStop(1, 'rgba(0,0,8,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
  })();
  function drawShade(x, y, w, h, a) { ctx.save(); ctx.globalAlpha = a; ctx.drawImage(shadeSprite, x - w / 2, y - h / 2, w, h); ctx.restore(); }

  // =====================================================================
  //  BACKGROUND (per-level nebula, gradient, decor)
  // =====================================================================
  var stars = [];
  [0.15, 0.35, 0.7].forEach(function (z) {
    for (var i = 0; i < 55; i++) stars.push({ x: rand(0, W), y: rand(0, H), z: z, ph: rand(0, 6.28), flare: z > 0.5 && i < 6 });
  });

  function makeNebula(hues, galaxies) {
    var n = document.createElement('canvas'); n.width = W; n.height = H;
    var c = n.getContext('2d'); c.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 16; i++) {
      var x = rand(0, W), y = rand(0, H), r = rand(90, 240), h = hues[i % hues.length], a = rand(0.08, 0.2);
      for (var k = -1; k <= 1; k++) {
        var g = c.createRadialGradient(x + k * W, y, 0, x + k * W, y, r);
        g.addColorStop(0, h + a + ')'); g.addColorStop(0.5, h + (a * 0.4) + ')'); g.addColorStop(1, h + '0)');
        c.fillStyle = g; c.fillRect(0, 0, W, H);
      }
    }
    for (var q = 0; q < (galaxies || 0); q++) {          // small distant spiral galaxies
      var gx = rand(120, W - 120), gy = rand(60, H - 60), rot = rand(0, 6.28), sq = rand(0.35, 0.6), gc = pick(['255,190,240', '170,220,255', '255,230,170']);
      var cg = c.createRadialGradient(gx, gy, 0, gx, gy, 18); cg.addColorStop(0, 'rgba(' + gc + ',0.6)'); cg.addColorStop(1, 'rgba(' + gc + ',0)');
      c.fillStyle = cg; c.fillRect(gx - 18, gy - 18, 36, 36);
      for (var arm = 0; arm < 2; arm++) for (var d = 0; d < 140; d++) {
        var aa = d * 0.09 + arm * Math.PI, rr = d * 0.32, lx = Math.cos(aa) * rr, ly = Math.sin(aa) * rr * sq;
        c.fillStyle = 'rgba(' + gc + ',' + (0.45 * (1 - d / 140)) + ')';
        c.fillRect(gx + lx * Math.cos(rot) - ly * Math.sin(rot) + rand(-1.5, 1.5), gy + lx * Math.sin(rot) + ly * Math.cos(rot) + rand(-1.5, 1.5), 1.4, 1.4);
      }
    }
    return n;
  }
  function makeBg(cols) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, cols[0]); g.addColorStop(0.5, cols[1]); g.addColorStop(1, cols[2]);
    return g;
  }
  var TITLE_LOOK = { nebula: ['rgba(40,255,140,', 'rgba(150,60,255,', 'rgba(0,140,255,', 'rgba(255,40,180,'],
                     bg: ['#020010', '#07041c', '#0d0328'], accent: C.mag };
  var neb = makeNebula(TITLE_LOOK.nebula), bgGrad = makeBg(TITLE_LOOK.bg), nebX = 0;
  var decor = [], decorFx = [], decorType = null;

  function setLook(look) {
    neb = makeNebula(look.nebula, look.galaxies); bgGrad = makeBg(look.bg);
    root.style.setProperty('--accent', look.accent);
    decorType = look.decor || null; decor = []; decorFx = [];
    if (decorType === 'wonder') for (var i = 0; i < 46; i++) decor.push({ x: rand(0, W), y: rand(0, H), z: rand(0.3, 1), ph: rand(0, 6.28), s: rand(5, 12), col: pick(['#ff8ad8', '#7fd4ff', '#ffd86b', '#b59bff', '#6dffc8']) });
    if (decorType === 'ancient') for (var m = 0; m < 9; m++) decor.push({ x: rand(0, W), y: rand(0, H), z: rand(0.2, 0.9), rot: rand(0, 6.28), vr: rand(-0.006, 0.006), s: rand(18, 46), kind: m % 4, g: Math.floor(rand(0, 16)) });
    if (decorType === 'dark') for (var f = 0; f < 7; f++) decor.push({ x: rand(0, W), y: rand(0, H), r: rand(120, 260), vx: -rand(0.1, 0.35), a: rand(0.06, 0.14) });

  // =====================================================================
  //  MONITOR FEED — makes gameplay look like a live long-range tracking-camera feed on a console monitor.

  // =====================================================================
  var feed = 0, crt = 0, feedCss = -1, staticT = 0, STATIC_LEN = 34, ret = { x: 110, y: H / 2 };
  var recEl = document.getElementById('nvg-rec');
  var noiseFrames = [0, 1, 2].map(function () {
    var c = document.createElement('canvas'); c.width = 200; c.height = 125;
    var g = c.getContext('2d'), d = g.createImageData(200, 125);
    for (var i = 0; i < d.data.length; i += 4) { var v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    g.putImageData(d, 0, 0); return c;
  });
  function triggerStatic() { staticT = STATIC_LEN; }

    feed += (want - feed) * Math.min(1, 0.06 * dt);
    // while actually flying, the picture stays clear: no grain, no rolling bar, light scanlines only
    var flying = state === 'playing' || state === 'paused' || state === 'info';
    crt += ((flying ? 0 : feed) - crt) * Math.min(1, 0.08 * dt);
    if (Math.abs(crt - feedCss) > 0.01) { feedCss = crt; root.style.setProperty('--feed', crt.toFixed(2)); }   // CSS scanlines follow
    if (staticT > 0) staticT -= dt;
    if (recEl) recEl.classList.toggle('on', feed > 0.5 && Math.floor(t / 40) % 2 === 0);
    if (player) { ret.x += (player.x - ret.x) * Math.min(1, 0.12 * dt); ret.y += (player.y - ret.y) * Math.min(1, 0.12 * dt); }
  }

    var rough = L && L.num === 2;                                    // the Hollow's signal is noisier
    if (crt > 0.02 && !DEV.noCrt) {
      ctx.save();
      ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = (rough ? 0.16 : 0.1) * crt;   // film grain
      ctx.drawImage(noiseFrames[Math.floor(Math.random() * 3)], 0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.05 * crt;                   // rolling interference bar
      var by = (t * 1.3) % (H + 160) - 80, g = ctx.createLinearGradient(0, by - 40, 0, by + 40);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(200,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, by - 40, W, 80);
      ctx.restore();
    }
    if (feed > 0.05 && (state === 'playing' || state === 'paused')) {
      var a = feed * 0.75;
      ctx.save(); ctx.globalAlpha = a; ctx.font = '700 10px ' + FONT; ctx.textBaseline = 'middle';
      if (Math.floor(t / 40) % 2 === 0) { ctx.fillStyle = '#ff3344'; ctx.beginPath(); ctx.arc(18, H - 16, 4, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#c9f7e6'; ctx.textAlign = 'left'; ctx.fillText('REC   FEED 02 · TRACKING CAM', 28, H - 16);
      var mm = Math.floor(levelTime / 60), ss = levelTime % 60;
      ctx.textAlign = 'right'; ctx.fillText('T+ ' + ('0' + mm).slice(-2) + ':' + ('0' + ss.toFixed(2)).slice(-5), W - 70, H - 16);
      var bars = rough ? 2 + (Math.random() < 0.3 ? 1 : 0) : 3 + (Math.random() < 0.15 ? 0 : 1);
      for (var i = 0; i < 4; i++) { ctx.fillStyle = i < bars ? '#c9f7e6' : 'rgba(201,247,230,0.2)'; ctx.fillRect(W - 56 + i * 9, H - 12 - i * 3 - 4, 6, i * 3 + 4); }

      ctx.globalAlpha = k; ctx.globalCompositeOperation = 'lighter';

    parts.forEach(function (q) { ctx.globalAlpha = Math.max(0, q.life); var s = q.size * (0.4 + q.life); drawGlow(q.col, q.x, q.y, s, s); });

    if (flashT > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (flashT / 22) * 0.7 + ')'; ctx.fillRect(0, 0, W, H); }
    if (['title', 'intro', 'story', 'credits', 'boot', 'prologue'].indexOf(state) < 0) drawHUD();
    drawDevOverlays();

  }

  // =====================================================================
  //  AUDIO ENGINE — everything is synthesized live with the Web Audio API (no audio files)
  //  Signal flow:  instruments/sfx -> bus (music | sfx) -> master -> compressor -> speakers
  //                each bus also has sends into its own echo (delay) and reverb
  // =====================================================================
  var AU = null;                                   // the audio graph, built on the first click/keypress
  var sfxOn = false, musicOn = true;               // sound starts off; the START screen's first click can turn it on
  try { var ap = JSON.parse(localStorage.getItem('nvg-audio') || 'null'); if (ap) { sfxOn = !!ap.sfx; musicOn = ap.music !== false; } } catch (e) {}
  function saveAudioPrefs() { try { localStorage.setItem('nvg-audio', JSON.stringify({ sfx: sfxOn, music: musicOn })); } catch (e) {} }

  function ensureAudio() {
    if (!sfxOn) return;
    if (!AU) {
      try {
        var ac = new (window.AudioContext || window.webkitAudioContext)();
        AU = { ac: ac };
        var comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(ac.destination);
        AU.master = G(0.8, comp);
        // shared buffers: 1 s of white noise + a 2.2 s reverb impulse response
        AU.noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        var nd = AU.noise.getChannelData(0); for (var i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
        var irLen = Math.floor(ac.sampleRate * 2.2); AU.ir = ac.createBuffer(2, irLen, ac.sampleRate);
        for (var ch = 0; ch < 2; ch++) { var d = AU.ir.getChannelData(ch); for (var j = 0; j < irLen; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / irLen, 3); }
        // distortion curve for the gritty bass/lead

        AU.mfx = makeFx(AU.music);
        AU.sfx = G(0.75, AU.master);
        AU.sfxFx = makeFx(AU.sfx);
        setInterval(scheduler, 25);

      } catch (e) { AU = null; return; }
    }
    if (AU.ac.state === 'suspended') AU.ac.resume();
  }
  function makeFx(out) {
    var ac = AU.ac;
    var d = ac.createDelay(1.5); d.delayTime.value = 0.33;
    var lp = F('lowpass', 2600, 0, null), fb = G(0.38, d);
    d.connect(lp); lp.connect(fb); lp.connect(G(0.55, out));

  }

  // tiny node helpers
  function G(v, dest) { var g = AU.ac.createGain(); g.gain.value = v; if (dest) g.connect(dest); return g; }
  function O(type, f, dest) { var o = AU.ac.createOscillator(); o.type = type; o.frequency.value = f; if (dest) o.connect(dest); return o; }
  function F(type, f, q, dest) { var b = AU.ac.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; if (dest) b.connect(dest); return b; }
  function N(dest) { var s = AU.ac.createBufferSource(); s.buffer = AU.noise; s.loop = true; if (dest) s.connect(dest); return s; }
  function DIST(dest) { var w = AU.ac.createWaveShaper(); w.curve = AU.curve; if (dest) w.connect(dest); return w; }

  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  var lastPlayed = {};

        '</div>' + devTog('noCrt', 'CRT EFFECTS OFF') + devTog('hitboxes', 'SHOW HITBOXES') + devTog('fps', 'FPS COUNTER') + '</section>' +
      '<section><h4>// AUDIO</h4>' + devTog('synthSfx', 'SYNTH-ONLY SOUND EFFECTS (A/B)') + '</section>' +
      '<section><h4>// SPAWNER</h4><div class="row"><select data-sel="type">' + typeOpts + '</select>' + devBtn('spawn', 'SPAWN') + devBtn('spawn5', 'x5') + '</div>' +
        '<div class="row wrap">' + devBtn('bossnow', 'SUMMON BOSS NOW') + devBtn('nova', 'NOVA BOMB') + devBtn('clear', 'CLEAR SCREEN') + '</div></section>' +
      '<section><h4>// RUN UPGRADES</h4><div class="row wrap col">' + rewardBtns + '</div></section>' +
      '<section><h4>// DATA</h4><div class="row wrap">' + devBtn('score', '+10,000 SCORE') + devBtn('resethi', 'WIPE HI-SCORE') + devBtn('resetrun', 'RESET UPGRADES') + '</div>' +
        '<div class="row dim">HI-SCORE ' + pad(best) + ' · STATE ' + state.toUpperCase() + (L ? ' · LV' + L.num : '') + '</div></section>' +
      '</div><div class="nvg-dev-foot">&gt; <span class="cur">_</span> ESC OR ✕ TO CLOSE</div>';
  }

  function openDev() {
    if (devOpen) return;
    devOpen = true; devPausedGame = false;
    if (state === 'playing') { state = 'paused'; keys = {}; pointer.active = false; devPausedGame = true; }
    devBuild(); devEl.classList.add('open'); SFX.uiSelect();
  }
  function closeDev(resume) {
    if (!devOpen) return;
    devOpen = false; devEl.classList.remove('open');
    if (resume !== false && devPausedGame && state === 'paused') state = 'playing';
    try { cv.focus({ preventScroll: true }); } catch (e) {}
  }
  function devNewRun() { score = 0; lives = 3; weapon = 1; newRecord = false; mods = freshMods(); taken = {}; seenInfo = {}; }
  function devEnsureRun() { if (!L || ['boot', 'prologue', 'title', 'intro', 'credits'].indexOf(state) >= 0) devNewRun(); }
  function devSetFilter(f) {
    DEV.filter = f;
    var map = { none: 'none', phosphor: 'grayscale(1) sepia(1) hue-rotate(75deg) saturate(4) brightness(1.1)', noir: 'grayscale(1) contrast(1.35)',
                thermal: 'invert(1) hue-rotate(180deg) saturate(3) contrast(1.2)', invert: 'invert(1)', rainbow: '' };
    cv.style.filter = map[f] || 'none';
  }

  function devAct(act) {
    var a = act.split(':'), cmd = a[0], arg = a[1];
    if (cmd === 'close') return closeDev();
    if (cmd === 'lvl' || cmd === 'boss') {
      var i = +arg; devEnsureRun(); levelIdx = i; startLevel(i);
      if (cmd === 'boss') { levelTime = L.bossAt - 0.5; scriptPos = script.length; }
      return closeDev(false);
    }
    if (cmd === 'scene') {
      devEnsureRun();
      if (arg === 'boot') { goTitle(); state = 'boot'; setLook(TITLE_LOOK); }
      else if (arg === 'prologue') startPrologue();
      else if (arg === 'title') toTitle();
      else if (arg === 'launch') { toTitle(); startIntro(); }
      else if (arg === 'ch1' || arg === 'ch2') { levelIdx = arg === 'ch1' ? 0 : 1; L = LEVELS[levelIdx]; setLook(L); startStory(levelIdx + 1); }
      else if (arg === 'reward') { levelIdx = Math.min(levelIdx, LEVELS.length - 2); L = LEVELS[levelIdx]; setLook(L); openReward(); }
      else if (arg === 'ending') { levelIdx = 2; L = LEVELS[2]; setLook(L); clearField(); boss = null; levelTime = L.bossAt + 5; state = 'ending'; endingT = 0; endT = performance.now(); newRecord = false; }
      else if (arg === 'credits') startCredits();
      return closeDev(false);
    }
    if (cmd === 'pu') { applyPickup(arg); return; }
    if (cmd === 'speed') { DEV.speed = +arg; devBuild(); return; }
    if (cmd === 'filter') { devSetFilter(arg); devBuild(); return; }
    if (cmd === 'spawn' || cmd === 'spawn5') {
      var type = devEl.querySelector('[data-sel="type"]').value;
      if (type === 'turret' && !cols.length) { texts.push({ x: W / 2, y: H / 2, txt: 'TURRETS NEED CAVE WALLS (LV3)', life: 1.5, col: C.red, size: 14 }); return; }
      for (var n = 0; n < (cmd === 'spawn5' ? 5 : 1); n++) spawn(type, W + 30 + n * 40, rand(90, H - 90), { amp: 40, ceil: n % 2 === 0 });
      return;
    }
    if (cmd === 'bossnow') { if (L && !boss) { bossTriggered = true; warnT = 0; boss = L.boss(); } return; }
    if (cmd === 'nova') { novaBomb(); return; }
    if (cmd === 'clear') { enemies = []; eBullets = []; rocks = []; lasers = []; return; }
    if (cmd === 'reward') {
      var r = REWARDS.filter(function (x) { return x.id === arg; })[0];
      if (r && (taken[r.id] || 0) < r.max) { taken[r.id] = (taken[r.id] || 0) + 1; r.apply(); if (r.id === 'drone') drones.push({ x: player.x, y: player.y }); if (r.id === 'barrier') player.shield = true; }
      devBuild(); return;
    }
    if (cmd === 'score') { score += 10000; devBuild(); return; }
    if (cmd === 'resethi') { best = 0; try { localStorage.removeItem('nvg-best'); } catch (e) {} devBuild(); return; }
    if (cmd === 'resetrun') { mods = freshMods(); taken = {}; drones = []; devBuild(); return; }
  }

  devEl.addEventListener('click', function (e) { var b = e.target.closest('[data-act]'); if (b) devAct(b.getAttribute('data-act')); });
  devEl.addEventListener('input', function (e) {
    var el = e.target, k = el.getAttribute('data-num');
    if (k) {
      var v = +el.value, out = el.nextElementSibling;
      if (k === 'lives') lives = v; else if (k === 'weapon') weapon = v; else if (k === 'speed') DEV.speed = v;
      if (out) out.textContent = k === 'speed' ? v.toFixed(2) + 'x' : v;
    }
  });
  devEl.addEventListener('change', function (e) {
    var f = e.target.getAttribute('data-flag');
    if (f) { DEV[f] = e.target.checked; if (f === 'noCrt') root.classList.toggle('nvg-nocrt', DEV.noCrt); if (f === 'synthSfx') USE_SFX_FILES = !DEV.synthSfx; }
  });
  devEl.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.preventDefault(); closeDev(); } e.stopPropagation(); });
  if (screwEl) screwEl.addEventListener('dblclick', function (e) {
    e.preventDefault(); screwEl.classList.remove('spin'); void screwEl.offsetWidth; screwEl.classList.add('spin');
    if (devOpen) closeDev(); else openDev();
  });
  var secret = 'VOID', typed = '';
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && devOpen) { closeDev(); return; }
    if (e.key && e.key.length === 1) { typed = (typed + e.key.toUpperCase()).slice(-secret.length); if (typed === secret) { typed = ''; openDev(); } }
  });

  // per-frame dev effects
  function devTick(dt) {
    if (DEV.infinite && state === 'playing') { buffs.rapid = Math.max(buffs.rapid, 300); buffs.homing = Math.max(buffs.homing, 300); }
    if (DEV.magnetAll && player && player.alive) pickups.forEach(function (p) { p.x += (player.x - p.x) * 0.08 * dt; p.y += (player.y - p.y) * 0.08 * dt; });
    if (DEV.filter === 'rainbow') cv.style.filter = 'hue-rotate(' + Math.round(t * 3 % 360) + 'deg) saturate(1.5)';
  }
  function drawDevOverlays() {
    if (DEV.hitboxes) {
      ctx.save(); ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      function circ(x, y, r, col) { ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); }
      enemies.forEach(function (e) { circ(e.x, e.y, e.r, '#ff0'); if (e.hist) for (var i = 1; i <= e.segN; i++) { var s = e.hist[i * 6]; if (s) circ(s.x, s.y, 11 - i * 0.5, '#ff0'); } });
      rocks.forEach(function (k) { circ(k.x, k.y, k.r * 0.9, '#fa0'); });
      eBullets.forEach(function (b) { circ(b.x, b.y, b.r, '#f44'); });
      if (boss && boss.entered) boss.targets().forEach(function (h) { circ(h.x, h.y, h.r, '#f0f'); });
      lasers.forEach(function (l) { if (l.tele <= 0) { ctx.strokeStyle = '#f44'; ctx.strokeRect(0, l.y - l.h / 2, l.x0, l.h); } });
      if (player && player.alive) { circ(player.x, player.y, player.r, '#0ff'); circ(player.x, player.y, 7, 'rgba(0,255,255,0.5)'); }
      ctx.restore();
    }
    if (DEV.fps) neon(Math.round(fpsVal) + ' FPS  ·  ' + (enemies.length + eBullets.length + parts.length) + ' OBJ  ·  ' + DEV.speed.toFixed(2) + 'x', W - 14, 44, 10, '#9fffd6', 'right', 4);
    if (DEV.god && state === 'playing') neon('INVINCIBLE', W / 2, H - 40, 10, '#ffe14d', 'center', 6, 0.6);
  }

  // =====================================================================
  //  MAIN LOOP
  // =====================================================================
  var last = performance.now();
  function loop(now) {
    var raw = Math.min((now - last) / 16.667, 3); fpsVal += (60 / Math.max(raw, 0.01) - fpsVal) * 0.05;
    var dt = raw * DEV.speed;
    last = now;
    if (visible) { devTick(dt); update(dt); draw(); updateMusic(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Test hook for automated testing (harmless; safe to delete)
  root.__nvg = {
    level: function (i) { if (!mods) mods = freshMods(); levelIdx = i; startLevel(i); },
    skipTo: function (sec) { levelTime = sec; while (scriptPos < script.length && script[scriptPos].t < sec - 3) scriptPos++; },
    story: function (i) { startStory(i); }, credits: function () { startCredits(); },
    music: function () { return { want: fileKey(musicWant), playing: curFile && curFile.key, cycles: curFile ? curFile.parts.length : 0, loaded: Object.keys(fileBufs), synth: !!seqTr }; },
    sfx: function () { return SFX; },
    god: function () { player.inv = 1e9; }, track: function () { if (boss) player.y = boss.y; },
    give: function (k) { collect({ kind: k, x: player.x, y: player.y }); },
    state: function () { return { state: state, score: score, lives: lives, level: L && L.num, boss: !!boss, hp: boss && Math.round(boss.hp), enemies: enemies.length, rewards: rewardChoices.map(function (r) { return r.id; }), mods: mods }; }
  };
})();
</script>
